{%- assign e = include.entry -%}
<article class="entry" id="{{ e.version }}">
  <div class="entry-rail">
    <a class="entry-version mono" href="{{ e.url | relative_url }}">{{ e.version }}</a>
    <time class="entry-date mono" datetime="{{ e.date | date: '%Y-%m-%d' }}">{{ e.date | date: "%b %-d, %Y" }}</time>
    {% include tags.html targets=e.targets %}
  </div>
  <div class="entry-body">{{ e.content | markdownify }}</div>
</article>
