<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% if page.version %}Subduction {{ page.version }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="description" content="{{ site.description }}" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1c1c1e;
        --muted: #6b6b70;
        --rule: #e4e4e8;
        --link: #0a58b8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141416;
          --fg: #ececf0;
          --muted: #a0a0a8;
          --rule: #2c2c31;
          --link: #7fb0ff;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main { max-width: 42rem; margin: 0 auto; padding: 3rem 16px 4rem; }
      h1 { font-size: 1.75rem; margin: 0 0 0.25rem; }
      .lede { color: var(--muted); margin: 0 0 2.5rem; }
      a { color: var(--link); }
      .entry { border-top: 1px solid var(--rule); padding: 1.5rem 0; }
      .entry h2 { font-size: 1.25rem; margin: 0; }
      .entry h2 a { color: inherit; text-decoration: none; }
      .entry h2 a:hover { text-decoration: underline; }
      .entry .meta { color: var(--muted); font-size: 0.875rem; margin: 0.125rem 0 0.75rem; }
      .entry h3 { font-size: 0.875rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 1rem 0 0.25rem; }
      .entry ul { margin: 0; padding-left: 1.25rem; }
      .entry p { margin: 0.5rem 0; }
      details.older { border-top: 1px solid var(--rule); padding-top: 1rem; }
      details.older summary { cursor: pointer; color: var(--muted); }
      .back { margin-top: 2rem; }
    </style>
  </head>
  <body>
    <main>{{ content }}</main>
  </body>
</html>
