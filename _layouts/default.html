<!doctype html>
<html lang="en" data-family="savanna">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% if page.version %}Subduction {{ page.version }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="description" content="{{ site.description }}" />
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/subduction-mark.svg' | relative_url }}" />
    {%- comment -%}
      The family's own sheets and Shelf's stylesheet, as the shelf ships
      them (generated by vaalbara's `pnpm run shelf:changelog`), then the
      changelog's own for its list and entries.
    {%- endcomment %}
    <link rel="stylesheet" href="{{ '/assets/savanna.css' | relative_url }}" />
    <link rel="stylesheet" href="{{ '/assets/fonts-savanna.css' | relative_url }}" />
    <link rel="stylesheet" href="{{ '/assets/savanna-light.css' | relative_url }}" />
    <link rel="stylesheet" href="{{ '/assets/shelf.css' | relative_url }}" />
    <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}" />
  </head>
  <body class="shelf">
{% include masthead.html %}
    <main>{{ content }}</main>
{% include footer.html %}
    <script>
      // The one enhancement: an anchor inside the folded older releases
      // opens the fold and scrolls to its entry. Without it the entry is
      // still reachable by opening the fold.
      function openTarget() {
        var id = decodeURIComponent(location.hash.slice(1));
        var target = id && document.getElementById(id);
        var fold = target && target.closest("details.older");
        if (fold && !fold.open) {
          fold.open = true;
          target.scrollIntoView();
        }
      }
      window.addEventListener("hashchange", openTarget);
      openTarget();
    </script>
  </body>
</html>
