<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% if page.version %}Subduction {{ page.version }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="description" content="{{ site.description }}" />
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/subduction-mark.svg' | relative_url }}" />
    <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}" />
  </head>
  <body>
    <header class="topbar">
      <div class="column">
        <img src="{{ '/assets/subduction-mark.svg' | relative_url }}" width="22" height="22" alt="" />
        <a class="brand" href="{{ '/' | relative_url }}">Subduction</a>
        {%- if page.version %}
        <span class="crumb-sep" aria-hidden="true">/</span>
        <a class="crumb" href="{{ '/' | relative_url }}">Releases</a>
        {%- endif %}
      </div>
    </header>
    <main>{{ content }}</main>
    <script>
      // The one enhancement: an anchor inside the folded older releases
      // opens the fold and scrolls to its entry. Without it the entry is
      // still reachable by opening the fold.
      function openTarget() {
        var id = decodeURIComponent(location.hash.slice(1));
        var target = id && document.getElementById(id);
        var fold = target && target.closest("details.older");
        if (fold && !fold.open) {
          fold.open = true;
          target.scrollIntoView();
        }
      }
      window.addEventListener("hashchange", openTarget);
      openTarget();
    </script>
  </body>
</html>
